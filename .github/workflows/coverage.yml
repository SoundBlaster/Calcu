name: Coverage

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        id: coverage_run
        run: npm run test:coverage

      - name: Upload coverage report
        # Diagnostics survive a failed test run; a successful producer must
        # still provide its report. Upload does not turn failed tests green.
        if: ${{ !cancelled() && steps.coverage_run.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ${{ steps.coverage_run.outcome == 'success' && 'error' || 'warn' }}
